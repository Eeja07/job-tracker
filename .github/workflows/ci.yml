name: Production CI/CD Pipeline

on:
  push:
    branches: [ main, master, develop, 'feature/*' ]
  pull_request:
    branches: [ main, master, develop ]

permissions:
  contents: read
  security-events: write
  packages: read

jobs:
  typecheck-and-lint:
    name: TypeScript & ESLint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Setup Node.js with pnpm cache
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        run: pnpm --filter api exec prisma generate

      - name: Run ESLint
        run: pnpm lint

      - name: Run TypeScript Compiler Check
        run: pnpm --filter api exec tsc --noEmit

  unit-tests:
    name: Unit Tests & Coverage
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Setup Node.js with pnpm cache
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        run: pnpm --filter api exec prisma generate

      - name: Run Unit Tests with Coverage
        run: pnpm --filter api test:cov

      - name: Upload Unit Test Coverage Artifact
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-coverage
          path: apps/api/coverage/
          retention-days: 14

  e2e-tests:
    name: E2E Integration Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: job_tracker
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/job_tracker?schema=public"
      JWT_ACCESS_SECRET: "test-access-secret-key-1234567890"
      JWT_REFRESH_SECRET: "test-refresh-secret-key-0987654321"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Setup Node.js with pnpm cache
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client & Sync DB Schema
        run: |
          pnpm --filter api exec prisma generate
          pnpm --filter api exec prisma db push

      - name: Run E2E Integration Tests
        run: pnpm --filter api test:e2e

  docker-build-security:
    name: Docker Build, Security Scan & SBOM
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build API Container Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/api/Dockerfile
          load: true
          tags: job-tracker-api:local
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run Trivy Vulnerability Scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'job-tracker-api:local'
          format: 'table'
          exit-code: '0'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'HIGH,CRITICAL'

      - name: Generate SBOM (Software Bill of Materials)
        uses: anchore/sbom-action@v0
        with:
          image: job-tracker-api:local
          format: spdx-json
          output-file: sbom.spdx.json

      - name: Upload SBOM Artifact
        uses: actions/upload-artifact@v4
        with:
          name: sbom-spdx-json
          path: sbom.spdx.json
          retention-days: 14

  pipeline-status:
    name: Pipeline Status (Branch Protection Required Check)
    runs-on: ubuntu-latest
    needs: [typecheck-and-lint, unit-tests, e2e-tests, docker-build-security]
    if: always()

    steps:
      - name: Verify All Pipeline Jobs Passed
        run: |
          if [ "${{ needs.typecheck-and-lint.result }}" != "success" ] || \
             [ "${{ needs.unit-tests.result }}" != "success" ] || \
             [ "${{ needs.e2e-tests.result }}" != "success" ] || \
             [ "${{ needs.docker-build-security.result }}" != "success" ]; then
            echo "CI/CD Pipeline failed one or more required jobs."
            exit 1
          fi
          echo "All CI/CD Pipeline jobs passed successfully."
