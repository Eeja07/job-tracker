name: CI Pipeline

on:
  push:
    branches: [ main, master, 'feature/*' ]
  pull_request:
    branches: [ main, master ]

jobs:
  test-and-lint:
    name: Test, Lint & Typecheck
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: job_tracker
          POSTGRES_USER: jobtracker
          POSTGRES_PASSWORD: change_me
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: "postgresql://jobtracker:change_me@localhost:5432/job_tracker?schema=public"
      JWT_ACCESS_SECRET: "test-access-secret-key-1234567890"
      JWT_REFRESH_SECRET: "test-refresh-secret-key-0987654321"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client & Sync DB Schema
        run: |
          pnpm --filter api exec prisma generate
          pnpm --filter api exec prisma db push

      - name: Lint codebase
        run: pnpm lint

      - name: Typecheck TypeScript
        run: pnpm --filter api exec tsc --noEmit

      - name: Run unit tests with coverage
        run: pnpm --filter api test:cov

      - name: Run E2E integration tests with coverage
        run: pnpm --filter api test:e2e --coverage

      - name: Upload coverage report artifact
        uses: actions/upload-artifact@v4
        with:
          name: code-coverage-report
          path: |
            apps/api/coverage/
            apps/api/coverage-e2e/
          retention-days: 14
