{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "job-tracker.fullname" . }}
  labels:
    {{- include "job-tracker.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "job-tracker.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector: {}
      ports:
        - protocol: TCP
          port: {{ .Values.service.port }}
  egress:
    - to:
        - namespaceSelector: {}
      ports:
        - protocol: TCP
          port: 5432 # PostgreSQL
        - protocol: TCP
          port: 6379 # Redis
        - protocol: UDP
          port: 53   # DNS
        - protocol: TCP
          port: 53   # DNS
        - protocol: TCP
          port: 443  # HTTPS External Services / Storage
{{- end }}
