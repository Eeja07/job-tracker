services:
  job-tracker-redis:
    image: redis:7-alpine
    container_name: job-tracker-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    networks:
      - homelab
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  job-tracker-api:
    build:
      context: /opt/apps/job-tracker
      dockerfile: apps/api/Dockerfile
    container_name: job-tracker-api
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: "3000"
      DATABASE_URL: ${DATABASE_URL:-postgresql://eeja:eejamakkutujuh@postgres:5432/job-tracker?schema=public}
      REDIS_HOST: job-tracker-redis
      REDIS_PORT: "6379"
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-job-tracker-access-secret-key-2026-secure}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-job-tracker-refresh-secret-key-2026-secure}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI:-https://job.eeja.fun/api/v1/gmail/callback}
      FRONTEND_URL: ${FRONTEND_URL:-https://job.eeja.fun}
      WA_GATEWAY_URL: ${WA_GATEWAY_URL:-http://gateway-whatsapp-bot:3001}
      WA_GATEWAY_API_KEY: ${WA_GATEWAY_API_KEY:-eeja_wa_gateway_secret_key_2026}
      WA_NOTIFICATION_PHONES: ${WA_NOTIFICATION_PHONES:-6281288092766}
    volumes:
      - api_storage:/app/apps/api/storage/uploads
    depends_on:
      job-tracker-redis:
        condition: service_healthy
    networks:
      - homelab

  job-tracker-web:
    build:
      context: /opt/apps/job-tracker
      dockerfile: apps/web/Dockerfile
    container_name: job-tracker-web
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: "3001"
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-https://job.eeja.fun/api}
    depends_on:
      - job-tracker-api
    networks:
      - homelab

networks:
  homelab:
    external: true

volumes:
  redis_data:
  api_storage:
