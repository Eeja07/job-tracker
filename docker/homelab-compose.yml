services:
  job-tracker-redis:
    image: redis:7-alpine
    container_name: job-tracker-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    networks:
      - homelab
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  job-tracker-api:
    build:
      context: /opt/apps/job-tracker
      dockerfile: apps/api/Dockerfile
    container_name: job-tracker-api
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: "3000"
      DATABASE_URL: ${DATABASE_URL:-postgresql://${DATABASE_URL}?schema=public}
      REDIS_HOST: job-tracker-redis
      REDIS_PORT: "6379"
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-}
    depends_on:
      job-tracker-redis:
        condition: service_healthy
    networks:
      - homelab

  job-tracker-web:
    build:
      context: /opt/apps/job-tracker
      dockerfile: apps/web/Dockerfile
    container_name: job-tracker-web
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: "3001"
      NEXT_PUBLIC_API_URL: "http://job.eeja.fun/api"
    depends_on:
      - job-tracker-api
    networks:
      - homelab

networks:
  homelab:
    external: true

volumes:
  redis_data:
