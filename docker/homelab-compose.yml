services:
  job-tracker-api:
    build:
      context: /opt/apps/job-tracker
      dockerfile: apps/api/Dockerfile
    container_name: job-tracker-api
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: "3000"
      DATABASE_URL: ${DATABASE_URL:-postgresql://eeja:secretpassword@postgres:5432/job-tracker?schema=public}
      REDIS_HOST: ${REDIS_HOST:-redis}
      REDIS_PORT: ${REDIS_PORT:-6379}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-}
    networks:
      - homelab

  job-tracker-web:
    build:
      context: /opt/apps/job-tracker
      dockerfile: apps/web/Dockerfile
    container_name: job-tracker-web
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: "3001"
      NEXT_PUBLIC_API_URL: "http://job.eeja.fun/api"
    depends_on:
      - job-tracker-api
    networks:
      - homelab

networks:
  homelab:
    external: true
